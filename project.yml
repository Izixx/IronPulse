name: IronPulse
options:
  bundleIdPrefix: com.ironpulse
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    DEVELOPMENT_TEAM: ""
targets:
  IronPulse:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: IronPulse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ironpulse.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: IronPulse/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
schemes:
  IronPulse:
    build:
      targets:
        IronPulse: all
    run:
      config: Debug
    archive:
      config: Release
